<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="txtGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5555"/>
      <stop offset="0.5" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#8a0000"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-150%" width="180%" height="400%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="240" fill="#050505"/>
  <g stroke="#160a0a" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>
  <ellipse cx="450" cy="88" rx="330" ry="44" fill="#ff0000">
    <animate attributeName="opacity" values="0.04;0.16;0.04" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <text x="450" y="112" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="60" font-weight="bold" letter-spacing="6" fill="url(#txtGrad)" filter="url(#glow)">IGOOR-OG</text>
  <text x="450" y="146" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" letter-spacing="5" fill="#ff4d4d">DEVELOPER · VIBE CODER · BUILDER</text>
  <text x="450" y="174" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="3" fill="#6e6e6e">EST. 2025 · INFRAESTRUTURA &amp; REDES · TÉCNICO EM ADS</text>
  <text x="20" y="224" font-family="Consolas, Menlo, monospace" font-size="11" fill="#ff0000">[ SYSTEM ONLINE ]</text>
  <text x="880" y="224" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#ff0000">igoor-og@github ▸</text>
  <rect x="0" y="-4" width="900" height="3" fill="#ff0000">
    <animate attributeName="y" values="-4;240;-4" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>
