<svg xmlns="http://www.w3.org/2000/svg" width="900" height="10" viewBox="0 0 900 10">
  <line x1="450" y1="5" x2="450" y2="5" stroke="#ff0000" stroke-width="2">
    <animate attributeName="x1" values="450;0" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="450;900" dur="2.2s" repeatCount="indefinite"/>
  </line>
  <circle cx="450" cy="5" r="3" fill="#ff0000">
    <animate attributeName="r" values="1;3;1" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite"/>
  </circle>
</svg>